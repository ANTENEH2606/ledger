services:
  db:
    image: postgres:16
    container_name: ledger
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ledger
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ledger_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate:v4.17.1
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./db/migrations:/migrations:ro
    command:
      - "-path"
      - "/migrations"
      - "-database"
      - "postgres://ledger:${PG_PASSWORD}@db:5432/ledger?sslmode=disable"
      - "up"

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://ledger:${PG_PASSWORD}@db:5432/ledger?sslmode=disable
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  ledger_data:
    external: true